name: Shared provider generator

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: provider-tools-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test shared provider generator
        run: |
          python3 -m unittest discover -s scripts/provider-tools -v
          python3 -m venv /tmp/demodb-hosting-tests
          /tmp/demodb-hosting-tests/bin/pip install -r scripts/hosting-tools/requirements.txt
          /tmp/demodb-hosting-tests/bin/python -m unittest discover -s scripts/hosting-tools -v
