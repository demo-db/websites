name: Build, validate, and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: demodb-websites-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_COMMIT: ${{ github.sha }}
      WRANGLER_SEND_METRICS: "false"
      HAS_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && (vars.CLOUDFLARE_ACCOUNT_ID != '' || secrets.CLOUDFLARE_ACCOUNT_ID != '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build provider-backed pages and verify types
        run: pnpm build
      - name: Test registry, similarity, Worker routing, and build marker
        run: pnpm test
      - name: TypeScript check
        run: pnpm typecheck
      - name: Validate Worker and static asset configuration
        run: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env=""
      - name: Deploy skipped because credentials are unavailable
        if: github.event_name == 'push' && env.HAS_CREDENTIALS != 'true'
        run: echo "::notice::Build passed; Cloudflare deploy skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is unavailable."
      - name: Deploy Worker and static assets
        if: github.event_name == 'push' && env.HAS_CREDENTIALS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.jsonc --env=""
      - name: Verify the deployed commit and public routes
        if: github.event_name == 'push' && env.HAS_CREDENTIALS == 'true'
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/smoke-live.mjs
