name: Build, validate, and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: demodb-websites-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds and tests the site as if config/postgresql-api.json said publicApiVerified: true,
  # using a fixture, so the flip in docs/postgresql-activation.md step f needs no test edits.
  # Its build output is never deployed.
  verified-postgresql-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_COMMIT: ${{ github.sha }}
      DEMODB_POSTGRESQL_API_CONFIG: scripts/fixtures/postgresql-api-verified.json
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test with PostgreSQL public API verified (fixture)
        run: pnpm test
      - name: Confirm the fixture selected the verified state
        run: |
          node -e "process.exit(JSON.parse(require('fs').readFileSync('src/data/generated/postgresql-api.json', 'utf8')).publicApiVerified === true ? 0 : 1)"
      - name: TypeScript check
        run: pnpm typecheck

  # Release validation of the downloads themselves: builds the asset tree exactly as the deploy job does, loads every
  # served PostgreSQL script into a throwaway PostgreSQL 17 and compares it with the pinned SQLite fixture, and
  # compares every served inGitDB archive with the fixture through the independent parity checker. The deploy job
  # waits for it, so a download that does not match its fixture is never published.
  served-formats:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_COMMIT: ${{ github.sha }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: throwaway
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --shm-size=512m
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check out provider repositories at their pinned revisions
        run: |
          mkdir -p "$RUNNER_TEMP/providers"
          python3 - <<'PY' > "$RUNNER_TEMP/pins.tsv"
          import json
          for d in json.load(open("config/databases.json"))["databases"]:
              print(d["id"], d["repository"], d["commit"], sep="\t")
          PY
          while IFS=$'\t' read -r id repo commit; do
            dir="$RUNNER_TEMP/providers/$id"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "$repo" "$commit"
            git -C "$dir" checkout -q FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$commit"
          done < "$RUNNER_TEMP/pins.tsv"
      - name: Generate and verify the derived downloads against their lock
        run: pnpm prepare:databases
      - name: Check the MySQL, SQL Server and Oracle scripts against the provider manifests and the pinned inputs (no Docker, no datatug binary)
        run: node scripts/dialect-scripts.mjs check --providers "$RUNNER_TEMP/providers"
      - name: Check that every pinned provider commit is on that provider's main (strict on a push to main; a pull request may pin an unlanded head)
        env:
          DEMODB_PIN_MODE: ${{ github.event_name == 'pull_request' && 'warn-ahead' || 'strict' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dialect-scripts.mjs check-pins
      - name: Load every served PostgreSQL script, parse the YAML with PyYAML, and check every inGitDB archive against its fixture
        env:
          DEMODB_LIVE_POSTGRES_URL: postgresql://postgres:throwaway@127.0.0.1:5432/postgres
          DEMODB_LIVE_POSTGRES_ALLOW_DROP: "1"
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/hosting-tools/requirements-live.txt
          # The inGitDB CLI at a pinned release and checksum validates every served archive too.
          curl -fsSL -o "$RUNNER_TEMP/ingitdb.tar.gz" https://github.com/ingitdb/ingitdb-cli/releases/download/v0.70.2/ingitdb_0.70.2_linux_amd64.tar.gz
          echo "763e4e6bebc5a7997b60bb09307e1be6db9dbae201e4c235851bcaf4ea0fb44b  $RUNNER_TEMP/ingitdb.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/ingitdb-cli" && tar -xzf "$RUNNER_TEMP/ingitdb.tar.gz" -C "$RUNNER_TEMP/ingitdb-cli"
          INGITDB_CLI="$RUNNER_TEMP/ingitdb-cli/ingitdb" "$RUNNER_TEMP/venv/bin/python" scripts/hosting-tools/validate_served_formats.py --providers "$RUNNER_TEMP/providers"

  deploy:
    needs: served-formats
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_COMMIT: ${{ github.sha }}
      WRANGLER_SEND_METRICS: "false"
      HAS_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && (vars.CLOUDFLARE_ACCOUNT_ID != '' || secrets.CLOUDFLARE_ACCOUNT_ID != '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Verify comparison fixture pins preserve commit history
        env:
          COMPARISON_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-comparison-fixture-history.mjs
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build provider-backed pages and verify types
        run: pnpm build
      - name: Test registry, similarity, static host bundles, and build marker
        run: pnpm test
      - name: TypeScript check
        run: pnpm typecheck
      - name: Validate every assets-only host configuration
        run: pnpm run deploy:dry-run
      - name: Deploy skipped because credentials are unavailable
        if: github.event_name == 'push' && env.HAS_CREDENTIALS != 'true'
        run: echo "::notice::Build passed; Cloudflare deploy skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is unavailable."
      # Every DemoDB host is an assets-only Worker (no script, one per host): requests never count against the
      # Workers request quota. scripts/deploy-hosts.mjs lists the account's Workers first (capacity preflight), then
      # runs `wrangler deploy` per config, which moves each custom domain and manages its DNS record. The token
      # needs Account > Workers Scripts: Edit, and on demodb.dev Zone > Workers Routes: Edit, Zone > DNS: Edit and
      # Zone: Read.
      - name: Deploy static host bundles
        if: github.event_name == 'push' && env.HAS_CREDENTIALS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:hosts
      - name: Verify the deployed commit and public routes
        if: github.event_name == 'push' && env.HAS_CREDENTIALS == 'true'
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: node --import tsx/esm scripts/smoke-live.mjs
